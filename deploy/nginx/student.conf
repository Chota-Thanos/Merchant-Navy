# Student website (dashboard.mymerchantnavy.com): Next.js running on port 3000 (see deploy/systemd/lms-student.service)
server {
    listen 80;
    server_name dashboard.mymerchantnavy.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# After this file is in place, run:  sudo certbot --nginx -d dashboard.mymerchantnavy.com
