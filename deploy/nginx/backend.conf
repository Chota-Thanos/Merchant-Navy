# Laravel: the API (api.mymerchantnavy.com) AND the admin panel (admin.mymerchantnavy.com) are the same app.
# Replace /var/www/lms with where you put the project. PHP version: adjust php8.3-fpm if different.
server {
    listen 80;
    server_name api.mymerchantnavy.com admin.mymerchantnavy.com;
    root /var/www/lms/backend/public;
    index index.php;

    client_max_body_size 64M;          # PDF uploads (must be above the 60 MB limit in config/livewire.php)
    client_body_timeout 300s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300s;     # admin imports and PDF processing can take a while
    }

    # Never serve hidden files (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
# After this file is in place, run:  sudo certbot --nginx -d api.mymerchantnavy.com -d admin.mymerchantnavy.com
